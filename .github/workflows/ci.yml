name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Check all .tf files are formatted
        run: terraform fmt -check -recursive

  test:
    name: Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Find modules with tests
        id: find
        run: |
          DIRS=$(find . -path "*/tests/*.tftest.hcl" \
                        -not -path "*/.terraform/*" \
                 | sed 's|/tests/[^/]*$||' \
                 | sort -u \
                 | tr '\n' ' ')
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Run terraform test for each module
        run: |
          set -e
          DIRS="${{ steps.find.outputs.dirs }}"
          if [ -z "$DIRS" ]; then
            echo "No modules with tests found — skipping."
            exit 0
          fi
          for dir in $DIRS; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false && terraform test)
            echo "::endgroup::"
          done
